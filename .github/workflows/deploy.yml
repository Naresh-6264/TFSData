name: Deploy to GitHub Pages

on:
  push:
    branches: [main, DevEnviournment]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject auth config
        run: |
          echo "=== Injecting auth-config.js ==="

          # Write to tools that need auth (only ai-adoption-tracker)
          for DIR in ai-adoption-tracker; do
            TARGET="$DIR/auth-config.js"
            mkdir -p "$DIR"
            printf '%s\n' "$AUTH_CONFIG_DATA" > "$TARGET"

            if [ -s "$TARGET" ]; then
              echo "✓ $TARGET created ($(wc -c < "$TARGET") bytes)"
            else
              echo "::error::$TARGET is empty — check AUTH_CONFIG_DATA secret"
              exit 1
            fi
          done

          if head -1 ai-adoption-tracker/auth-config.js | grep -q "var AUTH_CONFIG"; then
            echo "✓ Valid JavaScript — starts with 'var AUTH_CONFIG'"
          else
            echo "::warning::File does NOT start with 'var AUTH_CONFIG'"
          fi
        env:
          AUTH_CONFIG_DATA: ${{ secrets.AUTH_CONFIG_DATA }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
