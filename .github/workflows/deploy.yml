name: Deploy to GitHub Pages

on:
  push:
    branches: [main, DevEnviournment]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage publishable site
        run: |
          set -euo pipefail
          STAGE="_site"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          # Copy everything publishable, then prune internals.
          # rsync is preinstalled on ubuntu-latest runners.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='everything-claude-code' \
            --exclude='_site' \
            --exclude='CLAUDE.md' \
            --exclude='README.md' \
            --exclude='.gitignore' \
            --exclude='serve.js' \
            --exclude='cors-proxy' \
            ./ "$STAGE/"

          echo "Staged files:"
          find "$STAGE" -maxdepth 2 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 3600000
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
